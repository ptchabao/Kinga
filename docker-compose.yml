version: "3.8"

services:
  kinga-api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      SECRET_KEY: ${SECRET_KEY}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-8000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      - db
      - redis
    ports:
      - "8000:8000"
    volumes:
      - ./logs/api:/app/logs
    restart: unless-stopped

  kinga-admin-ui:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://kinga-api:8000}
      PORT: ${ADMIN_UI_PORT:-3000}
    depends_on:
      - kinga-api
    ports:
      - "3000:3000"
    restart: unless-stopped

  kinga-web-ui:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://kinga-api:8000}
      PORT: ${WEB_UI_PORT:-3001}
    depends_on:
      - kinga-api
    ports:
      - "3001:3001"
    restart: unless-stopped

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-safiri}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-safiri_password}
      POSTGRES_DB: ${POSTGRES_DB:-safiri_db}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "/etc/redis/redis.conf"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/etc/redis/redis.conf:ro
    restart: unless-stopped

volumes:
  db_data:
  redis_data:
